name: EAS Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      build_platform:
        description: Platform to build
        required: false
        default: android
        type: choice
        options:
          - android
          - ios

permissions:
  contents: read

jobs:
  eas-build:
    runs-on: ubuntu-latest
    env:
      EAS_TOKEN: ${{ secrets.EAS_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.build_platform) || '["android","ios"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify EAS CLI
        run: npx eas-cli@23.2.0 --version

      - name: Run EAS build
        if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && env.EAS_TOKEN != ''
        env:
          EXPO_TOKEN: ${{ env.EAS_TOKEN }}
        run: npx eas-cli@23.2.0 build --platform "${{ matrix.platform }}" --non-interactive
